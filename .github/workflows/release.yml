name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write # npm trusted publishing (OIDC), no long-lived NPM_TOKEN needed

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24" # npm >= 11.5 for trusted publishing
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Verify package name
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          if [ "$PACKAGE_NAME" != "@etheaven/codex-mcp-server" ]; then
            echo "❌ Package name mismatch. Expected @etheaven/codex-mcp-server, got $PACKAGE_NAME"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests and build
        run: |
          npm run lint
          npm run build
          npm test

      - name: Verify build output
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "❌ Build failed: dist/index.js not found"
            exit 1
          fi
          echo "✅ Build output verified"

      - name: Create tarball and check size
        id: pack
        run: |
          TARBALL=$(npm pack --json | jq -r '.[0].filename')
          SIZE=$(stat -c %s "$TARBALL")
          echo "📦 $TARBALL: $SIZE bytes"
          if [ $SIZE -gt 10485760 ]; then
            echo "⚠️ Warning: Package size exceeds 10MB"
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      # The GitHub release (with the installable tarball) is created first, so the
      # release is usable via `npx -y <tarball URL>` even if npm publishing fails.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.tarball }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          body: |
            ### Installation
            ```bash
            # Claude Code
            claude mcp add codex-cli -- npx -y https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.pack.outputs.tarball }}

            # Claude Code plugin (self-hosted marketplace)
            /plugin marketplace add ${{ github.repository }}
            /plugin install codex-mcp-server@codex-mcp-server
            ```

            Requires Codex CLI (`npm install -g @openai/codex`).

      - name: Publish to npm
        run: |
          # Uses npm trusted publishing (OIDC) when it is configured for this repo
          # on npmjs.com; otherwise falls back to the NPM_TOKEN secret.
          if ! npm publish --access public; then
            echo "::error::npm publish failed. If it is E404/E401, the npm token is missing or expired. Fix once: npmjs.com > @etheaven/codex-mcp-server > Settings > Trusted Publisher > GitHub Actions (repo ${{ github.repository }}, workflow release.yml). The GitHub release above is already live."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
